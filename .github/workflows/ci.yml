name: CI

on:
  push:
  pull_request:

# 仅运行测试，无需写权限
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本须与 pom.xml 的 java.version 保持一致
      - name: 配置 JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: 运行全量测试
        run: mvn -B test
