<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="读空气">
  <!--
    图标：圆角方块 + 一个"读"字。
    底色取产品界面里的蓝（面板的按钮就是 #3a67e0），字用白色。

    y 与字号不是估的：用画布量出白色墨迹的范围再回推——
    字号 88 时墨迹约 86×86（占 67%），中心落在 64,64。
    改这里之后要重新渲染 public/icon16|32|48|128.png。

    16px 那一档"读"会糊成一个字形块——这是汉字图标的固有代价，
    而现代屏幕的工具栏多用 32px 那一档，所以照旧保留。
  -->
  <rect width="128" height="128" rx="28" fill="#3a67e0"/>
  <text x="64" y="60" fill="#ffffff"
        font-family="'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
        font-size="88" font-weight="600" letter-spacing="0"
        text-anchor="middle" dominant-baseline="central">读</text>
</svg>
