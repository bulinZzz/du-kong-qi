spring:
  application:
    name: du-kong-qi
  datasource:
    url: jdbc:h2:mem:example;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: false

server:
  # 反向代理之后，服务器在 TCP 层看到的对端只是代理本身（同机部署时就是 127.0.0.1），真实客户端
  # 地址只能由代理通过 X-Forwarded-For 带进来。代理漏写这个头时，所有请求都会算到代理那一个地址
  # 上，按 IP 的限流会退化成全站共用一份额度的总闸。
  forward-headers-strategy: framework

# 对外接口的准入与限流。
api-guard:
  # 受保护的路径。新加的接口要写进来——这里的默认是"不保护"，漏写不会有任何提示。
  paths:
    - /atmosphere/**
  # 允许的请求来源。上线时填扩展自己的来源（chrome-extension://<扩展 ID>）；
  # 留空表示不校验来源，启动时会打一条警告。
  allowed-origins: []
  # 单个来源 IP 每分钟的请求数。它只是一道粗糙的刹车，挡住一个客户端猛按；真正的成本护栏是下面那条每日上限。
  # 设得宽是因为共享出口 IP 的用户（校园网、公司网、移动网络）会共用这份额度，设小了先误伤的是他们。
  per-ip-per-minute: 30
  # 全部请求的每日上限，这是个成本闸门。
  daily-limit: 5000

# 空气分析的模型接入：兼容 OpenAI 协议，密钥经环境变量注入，不写入仓库
atmosphere:
  llm:
    base-url: https://api.deepseek.com
    api-key: ${ATMOSPHERE_LLM_API_KEY:}
    model: deepseek-chat
    timeout: 30s
